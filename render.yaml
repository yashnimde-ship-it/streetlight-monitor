# Render Blueprint: one free web service serves both the API (/api) and the built React app.
# Render dashboard → New → Blueprint → pick this repo. You will be asked for the values marked sync: false.
#
# Database: by default the service runs a temporary in-memory MongoDB and reseeds the full dataset on every
# start (no external database needed; edits are lost on restart or when the free instance sleeps).
# For persistent data, add MONGODB_URI (MongoDB Atlas) in the service's Environment settings; it takes precedence.
services:
  - type: web
    name: streetlight-monitor
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm --prefix server install && npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: IN_MEMORY_DB
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: ADMIN_EMAIL
        value: admin@streetlight.local
      - key: ADMIN_PASSWORD
        sync: false # password for logging in to the live site
